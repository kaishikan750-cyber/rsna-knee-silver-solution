[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsna-knee-ensemble"
version = "0.1.0"
description = "Auditable five-branch, per-finding rank fusion for an RSNA Knee solution"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rsna-knee-ensemble = "rsna_knee_ensemble.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
